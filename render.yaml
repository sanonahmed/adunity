services:
  - type: web
    name: adunity
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      # Keep Render on the project's supported Node version. The referral API
      # uses Neon PostgreSQL; node:sqlite is only used by the local one-time importer.
      - key: NODE_VERSION
        value: 22.13.0
      - key: HOSTNAME
        value: 0.0.0.0

      # Server-only BotFather token used to verify Telegram initData. Set it in
      # the Render dashboard; without it /api/auth and /api/referral fail closed.
      - key: TELEGRAM_BOT_TOKEN
        sync: false

      # BotFather bot username, inlined at build time. Required for invite
      # links: https://t.me/<bot>?startapp=ref_<code>
      - key: NEXT_PUBLIC_TELEGRAM_BOT_USERNAME
        sync: false

      # Server-only Neon PostgreSQL connection string. Use the pooled URL from
      # Neon Console -> project -> Connect. Never add a NEXT_PUBLIC_ prefix.
      - key: DATABASE_URL
        sync: false
